[workspace]
members = [
    "apps/hermes",
    "crates/domain",
    "crates/ports",
    "crates/protocol",
    "crates/runtime",
    "crates/testkit",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
authors = ["Hermes contributors"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
futures-executor = "0.3"
futures-util = "0.3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "warn"
unwrap_used = "deny"
