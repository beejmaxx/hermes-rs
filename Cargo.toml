[workspace]
members = [
    "apps/hermesd",
    "crates/domain",
    "crates/ports",
    "crates/protocol",
    "crates/runtime",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
authors = ["Hermes contributors"]

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["bracketed-paste", "event-stream"] }
dirs = "6"
eventsource-stream = "0.2"
futures-core = "0.3"
futures-executor = "0.3"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
portable-pty = "0.9"
regex = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }
url = "2"
wiremock = "0.6"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "warn"
unwrap_used = "deny"
